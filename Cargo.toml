[package]
name = "ntex-ratelimiter"
version = "0.4.0"
edition = "2021"
authors = ["lollipopkit <a@lolli.tech>"]
description = "A rate limiter middleware for ntex web framework."
license = "MIT"
repository = "https://github.com/lollipopkit/ntex-ratelimiter"
readme = "README.md"
keywords = ["ntex", "rate-limiter", "middleware", "token-bucket"]
categories = ["web-programming", "network-programming"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
smol = ["dep:smol"]

[dependencies]
dashmap = "6"
itoa = "1"
ntex = "3"
tokio = { version = "1", features = [
    "sync",
    "time",
    "rt",
    "macros",
], optional = true }
smol = { version = "2", optional = true }

[dev-dependencies]
